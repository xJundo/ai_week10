[project]
name = "ai-week10"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gianni TUERO", email = "gianni.tuero@epitech.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
]

[project.scripts]
ai-week10 = "ai_week10:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
